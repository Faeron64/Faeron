<!DOCTYPE html>
<html>

  <title>Faeron</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background-image: url("https://cdn.discordapp.com/attachments/1507856003499032638/1507856646347554817/w9d42s8.gif?ex=6a136c6f&is=6a121aef&hm=04512cc13b5c955272ce272a2e3936a4c57a0b8ff2442e973a309c3daa5f72b8&");
      background-repeat: repeat;
      background-size: auto;
    }

    .box {
      background: rgba(0, 0, 0, 0.72);
      padding: 35px;
      margin: 70px auto;
      width: fit-content;
      max-width: 90%;
      border-radius: 22px;
      border: 2px solid white;
      box-shadow: 0 0 30px black;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 3px 3px 0 black;
    }

    p {
      font-size: 22px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      background: #ffffff;
      color: #111111;
      text-decoration: none;
      font-weight: bold;
      border-radius: 999px;
      border: 3px solid black;
      box-shadow: 4px 4px 0 black;
      transition: 0.15s;
    }

    .button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 black;
      background: #dbeafe;
    }

    .button img {
      width: 24px;
      height: 24px;
    }

    .game {
      background: #00ff99;
    }

    .social-title {
      margin-top: 35px;
      font-size: 18px;
      letter-spacing: 2px;
    }
  </style>
</head>
