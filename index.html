<!DOCTYPE html>
<html>
<head>
  <title>Faeron</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      background-image: url("https://cdn.discordapp.com/attachments/1507856003499032638/1507856646347554817/w9d42s8.gif?ex=6a136c6f&is=6a121aef&hm=04512cc13b5c955272ce272a2e3936a4c57a0b8ff2442e973a309c3daa5f72b8&");
      background-repeat: repeat;
      background-size: 120px 120px;
      background-color: #111;
    }

    .card {
      background: rgba(0, 0, 0, 0.65);
      padding: 40px;
      border-radius: 25px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 55px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      color: #ddd;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.07);
      background: #ddd;
    }

    .tag {
      margin-top: 25px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Faeron</h1>
    <p>Welcome to my website.</p>
    <p>I make Roblox games and cool stuff.</p>

    <a class="button" href="https://www.roblox.com/" target="_blank">
      Play My Roblox Game
    </a>
  </div>
</body>
</html>
