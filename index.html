<!DOCTYPE html>
<html>
<head>
  <title>Faeron</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background-image: url("https://raw.githubusercontent.com/Faeron64/Faeron/main/w9d42s8.gif");
      background-repeat: repeat;
      background-size: 32px 32px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .box {
      background: rgba(0, 0, 0, 0.72);
      padding: 35px;
      margin: 70px auto;
      width: fit-content;
      max-width: 90%;
      border: 2px solid white;
      box-shadow: 0 0 30px black;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 3px 3px 0 black;
    }

    p {
      font-size: 22px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      background: #ffffff;
      color: #111111;
      text-decoration: none;
      font-weight: bold;
      border: 3px solid black;
      box-shadow: 4px 4px 0 black;
      transition: 0.15s;
    }

    .button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 black;
      background: #dbeafe;
    }

    .button img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .polytoria-logo {
      width: 95px !important;
      height: auto !important;
      filter: invert(1);
    }

    .game {
      background: #00ff99;
    }

    .disabled {
      background: #777777;
      color: #cccccc;
      cursor: not-allowed;
      pointer-events: none;
    }

    .disabled:hover {
      transform: none;
      box-shadow: 4px 4px 0 black;
      background: #777777;
    }

    .social-title {
      margin-top: 35px;
      font-size: 18px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>FAERON</h1>

    <p>
      WELCOME to my website
      <img src="https://html5-editor.net/tinymce/plugins/emoticons/img/smiley-cool.gif" alt="cool">
    </p>

    <div class="buttons">
      <a class="button game" href="https://www.roblox.com/games/101294863351383" target="_blank">
        My ROBLOX Game Archive
      </a>

      <span class="button disabled">
        ???
      </span>
    </div>

    <div class="social-title">SOCIALS</div>

    <div class="buttons">
      <a class="button" href="https://x.com/Faeron64" target="_blank">
        <img src="https://cdn.simpleicons.org/x/000000" alt="Twitter icon">
        Twitter
      </a>

      <a class="button" href="https://youtube.com/@F4ER0N" target="_blank">
        <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube icon">
        YouTube
      </a>

      <a class="button" href="https://www.roblox.com/users/417428886/profile" target="_blank">
        <img src="https://cdn.simpleicons.org/roblox/000000" alt="Roblox icon">
        Roblox
      </a>

      <a class="button" href="https://polytoria.com/u/Faeron" target="_blank">
        <img class="polytoria-logo" src="https://cdn.polytoria.com/static/logo-new-dark-DkM6BZKO.webp" alt="Polytoria logo">
        
      </a>

      <a class="button" href="https://twitch.tv/faeron64" target="_blank">
        <img src="https://cdn.simpleicons.org/twitch/9146FF" alt="Twitch icon">
        Twitch
      </a>
    </div>
  </div>
</body>
</html>
