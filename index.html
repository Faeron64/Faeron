<!DOCTYPE html>
<html>
<head>
  <title>Faeron</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e1b4b, #312e81);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 25px;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 55px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      color: #ddd;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: white;
      color: #1e1b4b;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.07);
      background: #c7d2fe;
    }

    .tag {
      margin-top: 25px;
      color: #a5b4fc;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Faeron</h1>
    <p>Welcome to my website.</p>
    <p>I make Roblox games and cool stuff.</p>

    <a class="button" href="https://www.roblox.com/" target="_blank">
      Play My Roblox Game
    </a>

    <div class="tag">Made with GitHub Pages</div>
  </div>
</body>
</html>
